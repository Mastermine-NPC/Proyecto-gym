name: CI/CD - AuraFit Gym

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. INTEGRACIÓN CONTINUA (CI): Chequeo de sistema, migraciones y pruebas
  # ============================================================================
  ci-test:
    name: CI - Pruebas Django y Paradigmas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bd_aurafit
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key-aurafit-testing
      DJANGO_DEBUG: "True"
      USE_SQLITE: "False"
      DB_NAME: bd_aurafit
      DB_USER: postgres
      DB_PASSWORD: postgres_ci_password
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuración del sistema Django (System Check)
        run: python manage.py check

      - name: Verificar que no existan migraciones pendientes
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migraciones en PostgreSQL
        run: python manage.py migrate

      - name: Ejecutar pruebas unitarias y de integración (PostgreSQL)
        run: python manage.py test apps paradigmas.pruebas --verbosity 2

      - name: Ejecutar pruebas en modo SQLite (compatibilidad local)
        env:
          USE_SQLITE: "True"
        run: python manage.py test apps paradigmas.pruebas --verbosity 2

  # ============================================================================
  # 2. ENTREGA CONTINUA (CD - Paso 1): Construcción y push de imagen Docker (GHCR)
  # ============================================================================
  cd-docker-publish:
    name: CD - Build & Push Docker Image (GHCR)
    needs: ci-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos y tags para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. DESPLIEGUE CONTINUO (CD - Paso 2): Despliegue automático en VPS vía SSH
  # ============================================================================
  cd-deploy-vps:
    name: CD - Despliegue en Servidor VPS (SSH)
    needs: cd-docker-publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Verificar configuración de secretos SSH para VPS
        id: check_secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "deploy_enabled=false" >> $GITHUB_OUTPUT
            echo "Aviso: Los secretos VPS_HOST, VPS_USER o VPS_SSH_KEY no están configurados aún en el repositorio. Se omite el despliegue por SSH."
          else
            echo "deploy_enabled=true" >> $GITHUB_OUTPUT
          fi

      - name: Desplegar en VPS con Docker Compose vía SSH
        if: steps.check_secrets.outputs.deploy_enabled == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.VPS_DEPLOY_PATH || '~/Proyecto-gym' }}"
            eval DEPLOY_DIR=$DEPLOY_DIR
            if [ ! -d "$DEPLOY_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git fetch origin main
            git reset --hard origin/main
            docker compose pull || true
            docker compose up -d --build --remove-orphans
            docker image prune -f

