services:
  db:
    image: postgres:16-alpine
    container_name: aurafit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bd_aurafit}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bd_aurafit}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: ghcr.io/mastermine-npc/proyecto-gym:latest
    container_name: aurafit_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cambiar-en-produccion-aurafit-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      USE_SQLITE: ${USE_SQLITE:-False}
      DB_NAME: ${DB_NAME:-bd_aurafit}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  postgres_data:
